# Requires a changelog fragment in changelog.d/ for every pull request, except
# Dependabot updates and pull requests labelled "skip changelog".
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    name: Changelog fragment
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check for a fragment
        run: uv run --locked --only-group release towncrier check --compare-with "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
