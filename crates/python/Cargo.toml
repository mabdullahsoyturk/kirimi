[package]
name = "fast-multipart-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_fast_multipart"
crate-type = ["cdylib"]

[dependencies]
fast-multipart-core.workspace = true
pyo3 = "0.30"

[lints.rust]
# PyO3 macros expand to unsafe code.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
