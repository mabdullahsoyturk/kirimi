[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "kirimi-multipart"
dynamic = ["version"]
description = "Fast streaming multipart/form-data parser, written in Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Repository = "https://github.com/mabdullahsoyturk/kirimi"
Issues = "https://github.com/mabdullahsoyturk/kirimi/issues"
Benchmarks = "https://github.com/mabdullahsoyturk/kirimi/blob/master/bench/RESULTS.md"

[dependency-groups]
test = ["pytest", "hypothesis", "multipart==2.0.1"]
dev = ["maturin>=1.9,<2", { include-group = "test" }]
# The test dependencies are needed by ty.
lint = ["prek", "ruff", "ty", { include-group = "test" }]
release = ["towncrier"]

[tool.uv]
default-groups = ["dev", "lint", "release"]
# Rebuild the extension module on `uv sync`/`uv run` when the Rust code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "kirimi._kirimi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/mabdullahsoyturk/kirimi/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/mabdullahsoyturk/kirimi/pull/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
# Line length is left to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests access attributes for their side effects (errors).
"tests/*" = ["B018"]

[tool.ty.environment]
# Resolve `kirimi` from the source tree, so type checking does not
# need the compiled extension.
root = ["python", "."]
