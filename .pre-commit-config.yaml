# Git hooks, run with prek (https://github.com/j178/prek):
#
#     uv run prek install          # once, installs the pre-commit hook
#     uv run prek run --all-files  # manually
#
# ruff and ty run from the `lint` dependency group, so their versions come
# from uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check
        # Does not need the compiled extension (see `tool.ty.environment` in
        # pyproject.toml).
        entry: uv run --locked --only-group lint ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  # Scans staged changes only, so it finds nothing with --all-files; CI scans
  # the new commits (the `secrets` job in .github/workflows/ci.yml, which pins
  # the same version).
  - repo: https://github.com/betterleaks/betterleaks
    rev: 74c729658d38c63c15770d215d97f2c7d9b24391 # frozen: v2.0.0-rc.15
    hooks:
      - id: betterleaks
